# This file REPLACES the main application.properties; anything not set here comes from AppProperties.
#
# File-based, not in-memory: `jdbc:sqlite::memory:` gives every pooled connection its own empty database,
# which breaks SearchService's count on a second connection. TestSchemaConfig rebuilds the schema from the
# real Flyway migrations every run.
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:./target/test-db.sqlite?journal_mode=WAL&synchronous=OFF&foreign_keys=ON&busy_timeout=60000&temp_store=MEMORY
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
# For SchemaMigrationIT (ddl-auto=validate): `grouped` parses every table's column types, and the FTS5
# tables report an empty type, so the context fails to start. `individually` reads only mapped tables.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
# As in production, so the web ITs render detached entities.
spring.jpa.open-in-view=false
app.open-browser=false
app.data-dir=./target/test-data
# Out of the repo root. TestLogin gives every context a password with login required.
app.password-file=./target/test-password-delete-to-reset.txt
# Off here, or a few wrong-password tests across the run would end the JVM running every suite. FailedLoginShutdownIT
# turns it on in a context of its own, with the shutdown replaced.
app.security.max-failed-logins=0
# Off here, or every ChapterService.create in every suite would also run matching and file the chapter,
# changing what those suites test. The matching suites switch it on themselves.
app.match-auto-link-default=false
server.port=0

# A request's first write gives up this soon when the write lock stays taken, so the busy tests stay fast. Far
# above any uncontended wait, since a request that waits too long fails.
app.writes.request-wait-millis=300

# No subscription runner to race the suites either; they call SubscriptionRunner.runNext() themselves. A failed step
# may be tried again at once.
app.subscriptions.enabled=false
app.subscriptions.retry-after-failure-seconds=0
# No live worker to race the suites for queue rows; they call DownloadWorker.processNext() themselves.
# Retries are instant so a failure test does not sleep.
app.download.worker-enabled=false
app.download.mock-dir=./target/test-mock-server
app.download.retry-backoff-millis=0
app.download.page-retry-backoff-millis=0
# Nothing answers here, so no suite can reach the real nhentai; the nhentai suites point it at FakeNhentai.
# Unpaced, so they do not wait out nhentai's rate limits (RequestPacerTest covers the pacing).
app.download.nhentai.base-url=http://127.0.0.1:1
app.download.nhentai.gallery-requests-per-minute=0
app.download.nhentai.gallery-requests-per-minute-with-key=0
app.download.nhentai.favourites-requests-per-minute=0
app.download.nhentai.search-requests-per-minute=0
app.download.nhentai.search-requests-per-minute-with-key=0
app.download.nhentai.image-request-interval-millis=0
# Unpaced, and nothing answers at these addresses: the e-hentai and chaika suites point them at their fakes.
app.download.ehentai.api-url=http://127.0.0.1:1/api.php
app.download.ehentai.api-request-interval-millis=0
app.download.ehentai.ehentai-url=http://127.0.0.1:1
app.download.ehentai.exhentai-url=http://127.0.0.1:1
app.download.ehentai.search-request-interval-millis=0
app.download.chaika.base-url=http://127.0.0.1:1
app.download.chaika.api-request-interval-millis=0
app.download.chaika.page-request-interval-millis=0
# Every gallery-dl run starts FakeGalleryDl instead, in this JVM's java on the test classes, so no suite can start
# the real gallery-dl or reach a real site. It does what the fixture a suite writes into its folder says.
app.gallery-dl.command=${java.home}/bin/java,-cp,./target/test-classes,io.github.mocchikon.hentie.FakeGalleryDl,./target/fake-gallery-dl
app.gallery-dl.idle-timeout-seconds=20
app.gallery-dl.metadata-timeout-seconds=30
app.gallery-dl.version-timeout-seconds=30
app.gallery-dl.update-timeout-seconds=30
# No RAM-disk detection, so the suites behave the same on a Linux machine with tmpfs. ScratchSpaceTest
# covers the automatic choice.
app.storage.ram-disk-candidates=

# ---------------------------------------------------------------------------
# Image Compression
# ---------------------------------------------------------------------------
# Imported here too, so ImageCompressionModeIT checks the values that really ship, not a copy.
spring.config.import=classpath:image-compression-modes.properties
# The real bundled tools, as in production. A suite skips when its platform's copy is missing.
app.image-compression.enabled=true
app.image-compression.bin-dir=./bin
# A hung tool must not hold the build for five minutes.
app.image-compression.timeout-seconds=60
app.image-compression.transcode-cache-max-mb=64

# ---------------------------------------------------------------------------
# ComfyUI
# ---------------------------------------------------------------------------
# Suites point Settings at FakeComfyUi. The default address answers nothing, so no suite can reach a real
# ComfyUI on the developer's machine. Short limits so a broken test fails fast; the abandon grace stays above
# a test's poll gaps, or a page it still waits for would be dropped.
app.comfyui.default-url=http://127.0.0.1:1
app.comfyui.connect-timeout-seconds=2
app.comfyui.request-timeout-seconds=20
app.comfyui.job-timeout-seconds=20
app.comfyui.startup-timeout-seconds=20
app.comfyui.result-cache-max-mb=64
app.comfyui.abandon-after-millis=3000
