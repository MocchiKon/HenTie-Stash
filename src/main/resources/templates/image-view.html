<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reading')}"></head>
<body class="image-view-body" th:classappend="'mode-' + ${defaultViewMode.name().toLowerCase().replace('_','-')}">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div id="viewer" class="viewer">
    <div id="stage" class="img-stage">
        <img id="page-img" alt="page">
    </div>
    <p id="no-images" class="empty" hidden>This chapter has no images.</p>
</div>
<div id="process-status" class="process-status" role="status" aria-live="polite" hidden></div>
<!-- Shown by the first press past either end of the chapter; the second press moves on. -->
<div id="chapter-notice" class="chapter-notice" role="status" aria-live="polite" hidden></div>

<nav id="image-bar" class="image-bar">
    <div class="bar-inner">
        <div class="bar-side bar-left">
            <a id="back-btn" class="bar-btn icon-btn" th:href="@{/chapter/{id}(id=${chapterId})}"
               title="Back to the chapter (b)" aria-label="Back to the chapter">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
            <!-- image-view.js keeps it in step with the workflow picked: without one there is nothing to compare. -->
            <button type="button" id="original-btn" class="bar-btn icon-btn" aria-pressed="false"
                    aria-label="Show this page as stored" th:disabled="${defaultWorkflow == ''}"
                    th:title="${defaultWorkflow == '' ? 'Pick a workflow under the cogwheel to compare its pages with the pages as stored' : 'Show this page as stored (s)'}">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M10 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h5v2h2V1h-2v2zm0 15H5l5-6v6zm9-15h-5v2h5v13l-5-6v9h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
        </div>
        <div class="bar-center">
            <button type="button" id="prev-btn" class="bar-btn"
                    title="Previous (a / ←) - on the first page, twice for the previous chapter">&lt;</button>
            <span class="page-jump-wrap">
                <button type="button" id="counter" class="page-jump-btn" title="Click to jump to a page"
                        aria-haspopup="true" aria-expanded="false">0 / 0</button>
                <div id="page-jump-popup" class="page-jump-popup" hidden>
                    <input type="number" id="page-input" class="page-jump-input" min="1"
                           aria-label="Go to page" placeholder="Page #">
                    <button type="button" id="page-jump-go" class="bar-btn page-jump-go">Go</button>
                </div>
            </span>
            <button type="button" id="next-btn" class="bar-btn"
                    title="Next (d / →) - on the last page, twice for the next chapter">&gt;</button>
        </div>
        <div class="bar-side bar-right">
            <button type="button" id="hide-btn" class="bar-btn icon-btn" title="Hide UI (press h to show)" aria-label="Hide UI">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>
            </button>
            <div class="bar-settings">
                <button type="button" id="settings-btn" class="bar-btn icon-btn" title="View settings"
                        aria-label="View settings" aria-haspopup="true" aria-expanded="false">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                        <path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                    </svg>
                </button>
                <div id="settings-popup" class="settings-popup" hidden>
                    <label class="popup-row">
                        <span>View mode</span>
                        <select id="mode-select" title="View mode">
                            <option th:each="m : ${viewModes}" th:value="${m.name()}" th:text="${m.displayName}"
                                    th:selected="${m == defaultViewMode}">mode</option>
                        </select>
                    </label>
                    <label class="popup-row">
                        <span>Workflow</span>
                        <!-- The rest of the list is fetched by image-view.js, so ComfyUI never holds up the page. -->
                        <select id="workflow-select" title="ComfyUI workflow the pages are shown through">
                            <option value="">None</option>
                            <option th:if="${defaultWorkflow != ''}" th:value="${defaultWorkflow}"
                                    th:text="${defaultWorkflow}" selected>default</option>
                        </select>
                    </label>
                    <p id="workflow-note" class="popup-note" hidden></p>
                </div>
            </div>
        </div>
    </div>
</nav>

<script th:inline="javascript">
    window.IMAGE_VIEW = {
        pageUrls: /*[[${pageUrls}]]*/ [],
        startPage: /*[[${startPage}]]*/ 1,
        defaultViewMode: /*[[${defaultViewMode.name().toLowerCase().replace('_','-')}]]*/ 'fit',
        backHref: /*[[@{/chapter/{id}(id=${chapterId})}]]*/ '/',
        neighbourUrl: /*[[@{/chapter/{id}/neighbour(id=${chapterId})}]]*/ '/chapter/0/neighbour',
        chapterBase: /*[[@{/chapter/}]]*/ '/chapter/',
        pagesAhead: /*[[${pagesAhead}]]*/ 6,
        defaultWorkflow: /*[[${defaultWorkflow}]]*/ '',
        processBase: /*[[@{/comfyui/pages/{id}(id=${chapterId})}]]*/ '/comfyui/pages/0',
        leaveUrl: /*[[@{/comfyui/leave}]]*/ '/comfyui/leave',
        workflowsUrl: /*[[@{/comfyui/workflows}]]*/ '/comfyui/workflows'
    };
</script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/image-view.js}"></script>
</body>
</html>
