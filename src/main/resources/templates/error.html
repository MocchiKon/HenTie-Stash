<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container narrow">
    <h1 th:text="${status} ?: 'Error'">Error</h1>
    <p class="hint" th:text="${error}">Something went wrong.</p>
    <p th:if="${message}" th:text="${message}"></p>
    <div class="btn-row">
        <!-- Back to the form, which the browser usually still has filled in, so trying again is one click. -->
        <button type="button" class="btn btn-accent" th:if="${retryable}" data-history-back>Go back</button>
        <a class="btn" th:classappend="${retryable} ? '' : 'btn-accent'" th:href="@{/}">Back to search</a>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
