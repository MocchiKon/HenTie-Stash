# ---------------------------------------------------------------------------
# The three built-in Image Compression modes.
#
# A file of its own, imported by BOTH application.properties and the test profile: the test profile
# REPLACES the main file, so values kept only there would be missing in every test (and
# ImageCompressionModeIT asserts these numbers).
#
# The three modes always exist and cannot be edited in the UI. For other numbers, make a custom mode
# (Settings -> Image Compression -> Custom).
#
# The built-in modes leave image-height-limit unset, so every image they select goes through ImageMagick.
# Set it on a mode of your own to skip ImageMagick's arguments for images at or below that height.
#
#   encoder                  JXL (cjxl) or AVIF (avifenc)
#   encoder-args             passed to the encoder verbatim
#   magick-args              passed to ImageMagick verbatim; BLANK = do not call ImageMagick at all
#   image-height-limit       apply magick-args only to images taller than this many px; UNSET = every image
#   min-relative-reduction   percent that must be saved, or the original is kept; 0 = no check
#   min-absolute-reduction   KB that must be saved, or the original is kept; 0 = no check
#   formats                  input extensions to process; BLANK = every image
# ---------------------------------------------------------------------------
app.image-compression.lossless.encoder=JXL
app.image-compression.lossless.encoder-args=-q 100 -e 10
app.image-compression.lossless.magick-args=
app.image-compression.lossless.min-relative-reduction=0
app.image-compression.lossless.min-absolute-reduction=0
app.image-compression.lossless.formats=JPG,PNG

app.image-compression.high-reduction.encoder=JXL
app.image-compression.high-reduction.encoder-args=-q 60 -e 10
app.image-compression.high-reduction.magick-args=-filter lanczos -resize 50%
app.image-compression.high-reduction.min-relative-reduction=20
app.image-compression.high-reduction.min-absolute-reduction=20
app.image-compression.high-reduction.formats=JPG,PNG,WEBP

app.image-compression.very-high-reduction.encoder=AVIF
app.image-compression.very-high-reduction.encoder-args=-q 35 -s 0
app.image-compression.very-high-reduction.magick-args=-filter lanczos -resize 50%
app.image-compression.very-high-reduction.min-relative-reduction=20
app.image-compression.very-high-reduction.min-absolute-reduction=20
app.image-compression.very-high-reduction.formats=JPG,PNG,WEBP
