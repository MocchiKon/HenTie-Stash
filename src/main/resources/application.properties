spring.application.name=HenTie
# In their own file because the test profile replaces this one wholesale and must import the same modes.
spring.config.import=classpath:image-compression-modes.properties

# ---------------------------------------------------------------------------
# Web server - all interfaces, so the app is reachable on the LAN
# ---------------------------------------------------------------------------
server.address=0.0.0.0
server.port=7395

# ---------------------------------------------------------------------------
# Shutdown - Ctrl+C in the console, or Settings -> Shut down
# ---------------------------------------------------------------------------
# Requests still running get up to a minute to finish; then the server stops anyway. Nothing depends on a
# graceful stop: longer work commits in slices, and an unfinished download runs again on the next start.
# Closing the console window instead gives the app only the few seconds Windows allows.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=1m

# ---------------------------------------------------------------------------
# Datasource - file-based SQLite
# ---------------------------------------------------------------------------
# Pragmas, applied per connection by the driver:
#   journal_mode=WAL   - readers run alongside the single writer.
#   synchronous=NORMAL - no fsync per commit; a crash can lose the last commit but never corrupts the file.
#   foreign_keys=ON    - SQLite leaves them off by default.
#   busy_timeout=60000 - how long a statement waits for the write lock. A write transaction sets its own wait
#                        for its first statement (config/WriteGate); this covers the rest: Flyway and ANALYZE
#                        at startup, and readers while SQLite recovers after a crash.
#   cache_size=-524288 - 512 MB page cache (negative = KiB).
#   temp_store=MEMORY  - sort buffers and IN lists in RAM. Each is a B-tree of its own with a fixed 2 MB
#                        cache, so cache_size does not reach them; spilled to a temp file, a big sort ran
#                        ~50% slower (and a bad plan 9x). Costs RAM for the length of one query.
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:./db/mydbNew.db?journal_mode=WAL&synchronous=NORMAL&foreign_keys=ON&busy_timeout=60000&cache_size=-524288&temp_store=MEMORY

# ---------------------------------------------------------------------------
# JPA / Hibernate + Flyway
#
# Flyway owns the schema; Hibernate never runs DDL. No baseline-on-migrate on purpose: a non-empty file
# Flyway did not build makes migrate() fail loudly.
# ---------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# In-memory caching (Caffeine)
# ---------------------------------------------------------------------------
spring.cache.type=caffeine

# ---------------------------------------------------------------------------
# Image uploads
# ---------------------------------------------------------------------------
# One part per selected image, plus the form's token. Tomcat's default of 50 parts rejects a chapter's
# worth of pages with 413 before any controller runs, however small the request is.
server.tomcat.max-part-count=-1
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=256MB
# A rejected upload is read to the end (up to this many remaining bytes) before the connection closes, so
# the 413 page reaches the browser. Tomcat's 2 MB default left a large upload with an empty page instead.
server.tomcat.max-swallow-size=256MB

# ---------------------------------------------------------------------------
# Application settings (app.*)
# ---------------------------------------------------------------------------
# None on purpose: every app.* default lives in config/AppProperties.java (app.download.mock-dir in
# MockDataDownloader), because the test profile replaces this file. Override one for an install in an
# application.properties next to the jar, e.g.
#   app.data-dir=D:/comics
